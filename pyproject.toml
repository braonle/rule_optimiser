[build-system]
requires = [
    "setuptools>=61.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "rule_optimiser"
version = "1.3.15"
authors = [
    {   name="Yaroslav Bondarenko"   },
]
description = "Optimize ZIA/ZPA rules by finding clusters of similar entries"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "openpyxl==3.1.2",
    "requests==2.34.2"
]

[tool.setuptools.packages.find]
where = ["src"]